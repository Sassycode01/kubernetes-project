apiVersion: apps/v1
kind: Deployment

metadata:
  name: node-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: node-app

  template:
    metadata:
      labels:
        app: node-app

    spec:
      containers:
        - name: node-app
          image: kubernetes-node-app:2.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: node-app-config
            - secretRef:
                name: node-app-secret
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: node-app-storage
              mountPath: /app/data
      volumes:
        - name: node-app-storage
          persistentVolumeClaim:
            claimName: node-app-pvc